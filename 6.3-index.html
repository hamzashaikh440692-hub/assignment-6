<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Document</title>
</head>
<body>

<div class="form">
<center>
   <h1>Student Registration Form</h1>

<form>

<table>

<tr>
    <td>Roll no. :</td>
    <td>
        <input type="text" size="42%">
    </td>
</tr>

<tr>
    <td>Student name :</td>
    <td>
        <input type="text" placeholder="First Name" size="17%"> - <input type="text" placeholder="Last Name" size="17%">
    </td>
</tr>

<tr>
    <td>Father's name :</td>
    <td>
        <input type="text" size="42">
    </td>
</tr>

<tr>
    <td>Date of birth :</td>
    <td>
        <input type="text" placeholder="Day" class="small" size="4">
        -
        <input type="text" placeholder="Month" class="small" size="4">
        -
        <input type="text" placeholder="Year" class="small" size="4">
        <i>(DD-MM-YYYY)</i>
    </td>
</tr>

<tr>
    <td>Mobile no. :</td>
    <td>
        <input type="text" value="+91" style="width:25px;">
        -
        <input type="text" size="35">
    </td>
</tr>

<tr>
    <td>Email id :</td>
    <td>
        <input type="text" size="42">
    </td>
</tr>

<tr>
    <td>Password :</td>
    <td>
        <input type="password" size="42">
    </td>
</tr>

<tr>
    <td>Gender :</td>
    <td>
        <input type="radio" name="gender"> Male
        <input type="radio" name="gender"> Female
    </td>
</tr>

<tr>
    <td>Department :</td>
    <td>
        <input type="checkbox"> CSE
        <input type="checkbox"> IT
        <input type="checkbox"> ECE
        <input type="checkbox"> Civil
        <input type="checkbox"> Mech
    </td>
</tr>

<tr>
    <td>Course :</td>
    <td>
      
        <select>
            <option >------------------ Select Current Course's ------------------</option>
            <option>BSCS</option>
            <option>BSIT</option>
            <option>BBA</option>
            <option>Engineering</option>
        </select>
    </td>
</tr>

<tr>
    <td>Student photo :</td>
    <td>
        <input type="file">
    </td>
</tr>

<tr>
    <td>City :</td>
    <td>
        <input type="text" size="42">
    </td>
</tr>

<tr>
    <td>Address :</td>
    <td>
          <textarea rows="4" cols="42px"></textarea>
    </td>
</tr>
      <tr>
         
         <td></td>
         <td>
        <input type="submit" value="Register">
    </td>
      </tr>
</table>
</form>
</div>
</center>

</body>
</html>
