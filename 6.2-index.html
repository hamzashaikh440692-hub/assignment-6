<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Document</title>
</head>
<body>
   <center>
   <table>
      <center><u><h1>Registeration Form</h1></center>
    
       <form>
   <tr>
      <td><label for="">First Name</label></td>
      <td><input type="text"></td>
   </tr>
   <tr>
      <td><label for="">Last Name</label></td>
      <td><input type="text"></td>
   </tr>
   <tr>
      <td><label for="">Nick Name</label></td>
      <td><input type="text"></td>
   </tr>
   <tr>
      <td><label for="">E-mail</label></td>
      <td><input type="email"></td>
   </tr>
   <tr>
      <td><label for="Password">Password</label></td>
      <td><input type="password"></td>
   </tr>
   <tr>
      <td><label for="">Date of Birth</label></td>
      <td><input type="text"></td>
   </tr>
   <tr>
      <td><label for="">Gender</label></td>
      <td><input type="radio" name="Gender" value="m">Male
         <input type="radio" name="Gender" value="f">Female
         <input type="radio" name="Gender" value="o">Other</td>

   </tr>
   <tr>
      <td><label for="">Mobile</label></td>
      <td><input type="text"
           name="mobile"
           maxlength="11"
           inputmode="numeric"
           pattern="[0-9]{11}"
          
           required></td>

   </tr>
   <tr>
<td>
    <label for="address">Address</label>
</td>
<td>
    <textarea id="address" name="address" rows="5" cols="30"></textarea>
</td>
<tr>
   <td><input type="submit" value="submit"></td>
   <td><input type="reset" value="reset"></td>
</tr>   
   
   </form>
    
   </table>
</center>

       
 
</body>
</html>
